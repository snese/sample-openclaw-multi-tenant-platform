name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ============================================================
  # Rust Operator CI — only runs when operator/ changes
  # ============================================================
  rust-check:
    name: "Rust: compile + clippy"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.title, 'operator') ||
      true
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile check
        run: cargo check --all-targets

      - name: Verify CRD generation
        run: |
          cargo run --bin crdgen > /tmp/crd-generated.yaml
          diff -u yaml/crd.yaml /tmp/crd-generated.yaml || {
            echo "❌ CRD yaml is out of date. Run: cargo run --bin crdgen > yaml/crd.yaml"
            exit 1
          }
          echo "✅ CRD yaml is up to date"

  rust-test:
    name: "Rust: unit tests"
    runs-on: ubuntu-latest
    needs: rust-check
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator

      - name: Run unit tests
        run: cargo test --lib --all-features

  rust-integration:
    name: "Rust: K8s integration test"
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: operator

      - name: Build operator binary
        working-directory: operator
        run: cargo build --release --bin tenant-operator

      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: test
          args: --no-lb --k3s-arg "--disable=traefik@server:0"

      - name: Install CRD
        run: kubectl apply -f operator/yaml/crd.yaml

      - name: Wait for CRD
        run: kubectl wait --for=condition=Established crd/tenants.openclaw.io --timeout=30s

      - name: Run operator in background
        run: |
          operator/target/release/tenant-operator &
          OPERATOR_PID=$!
          echo "OPERATOR_PID=$OPERATOR_PID" >> $GITHUB_ENV
          sleep 5

      - name: Health check
        run: curl -sf http://localhost:8080/health | jq .

      - name: Metrics endpoint
        run: curl -sf http://localhost:8080/metrics | head -5

      - name: Create test tenant
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: openclaw.io/v1alpha1
          kind: Tenant
          metadata:
            name: test-alice
            namespace: default
          spec:
            email: alice@example.com
            displayName: Alice
            skills:
              - weather
            budget:
              monthlyUSD: 50
            enabled: true
          EOF

      - name: Wait for reconciliation
        run: |
          for i in $(seq 1 30); do
            PHASE=$(kubectl get tenant test-alice -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "Attempt $i: phase=$PHASE"
            if [ "$PHASE" = "Ready" ]; then
              echo "✅ Tenant reconciled to Ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Tenant did not reach Ready phase"
          kubectl get tenant test-alice -o yaml
          exit 1

      - name: Verify namespace created
        run: kubectl get namespace openclaw-test-alice

      - name: Verify PVC created
        run: kubectl get pvc test-alice-data -n openclaw-test-alice

      - name: Verify ServiceAccount created
        run: kubectl get sa test-alice -n openclaw-test-alice

      - name: Verify NetworkPolicy created
        run: kubectl get networkpolicy default-deny -n openclaw-test-alice

      - name: Verify status conditions
        run: |
          CONDITIONS=$(kubectl get tenant test-alice -o jsonpath='{.status.conditions[*].type}')
          echo "Conditions: $CONDITIONS"
          for cond in NamespaceReady NetworkPolicyApplied; do
            echo "$CONDITIONS" | grep -q "$cond" || { echo "❌ Missing condition: $cond"; exit 1; }
          done
          echo "✅ All expected conditions present"

      - name: Test tenant deletion
        run: |
          kubectl delete tenant test-alice
          sleep 15
          kubectl get namespace openclaw-test-alice 2>&1 | grep -q "not found\|Terminating" && echo "✅ Namespace cleanup triggered" || echo "⚠️ Namespace still exists"

      - name: Stop operator
        if: always()
        run: kill $OPERATOR_PID 2>/dev/null || true

  rust-docker:
    name: "Rust: Docker build"
    runs-on: ubuntu-latest
    needs: rust-check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: operator
        run: docker build -t tenant-operator:test .

  # ============================================================
  # CDK / Helm / Scripts CI
  # ============================================================
  platform-lint:
    name: "Platform: CDK + Helm + Scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm ci

      - name: TypeScript compile check
        working-directory: cdk
        run: npx tsc --noEmit

      - name: CDK synth (validate templates)
        working-directory: cdk
        run: |
          cp cdk.json.example cdk.json
          npx cdk synth --no-staging 2>&1 || true

      - name: Helm lint
        run: |
          helm lint helm/charts/openclaw-platform/ \
            --set ingress.enabled=true \
            --set ingress.host=test.example.com \
            --set tenant.name=test

      - name: Shell script syntax check
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "✅ $f" || echo "❌ $f"
          done

  # ============================================================
  # Security & Quality Gates
  # ============================================================
  security-scan:
    name: "Security: sensitive data + CJK + audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No AWS account IDs
        run: |
          # Pattern: 12-digit numbers that look like AWS account IDs
          MATCHES=$(grep -rn '[0-9]\{12\}' \
            --include="*.ts" --include="*.py" --include="*.sh" --include="*.rs" --include="*.html" \
            2>/dev/null | grep -v node_modules | grep -v cdk.out | grep -v ".git/" | grep -v target/ \
            | grep -v cdk.json | grep -v package-lock | grep -v Cargo.lock | grep -v "\.d\.ts" \
            | grep -vE '(timeout|duration|timestamp|port|size|bytes|0000|1234|version|test)' \
            | grep -E '[0-9]{12}' || true)
          if [ -n "$MATCHES" ]; then
            echo "⚠️ Potential AWS account IDs found (review manually):"
            echo "$MATCHES" | head -10
          fi
          echo "✅ Account ID scan complete"

      - name: No hardcoded secrets
        run: |
          # Check for common secret patterns
          SECRETS=$(grep -rn 'AKIA[A-Z0-9]\{16\}\|sk-[a-zA-Z0-9]\{20,\}\|password\s*=\s*["\x27][^"\x27]\+["\x27]' \
            --include="*.ts" --include="*.py" --include="*.sh" --include="*.rs" --include="*.yaml" \
            2>/dev/null | grep -v node_modules | grep -v cdk.out | grep -v ".git/" | grep -v target/ \
            | grep -v "example\|placeholder\|template\|TODO\|CHANGEME" || true)
          if [ -n "$SECRETS" ]; then
            echo "❌ Potential hardcoded secrets found:"
            echo "$SECRETS"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: No CJK characters in code
        run: |
          python3 -c "
          import glob, os
          found = []
          for ext in ['*.ts', '*.py', '*.sh', '*.rs', '*.html']:
              for f in glob.glob(f'**/{ext}', recursive=True):
                  if any(x in f for x in ['node_modules','cdk.out','.git','target/']): continue
                  try:
                      with open(f) as fh:
                          for i, line in enumerate(fh, 1):
                              if any('\u4e00' <= c <= '\u9fff' for c in line):
                                  found.append(f'{f}:{i}')
                  except: pass
          if found:
              print(f'❌ Found CJK characters in {len(found)} lines:')
              for f in found[:10]: print(f'  {f}')
              exit(1)
          print('✅ No CJK characters in code')
          "

      - name: Rust dependency audit
        working-directory: operator
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cargo audit || echo "⚠️ Audit found advisories (non-blocking)"
